{% load static %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block titulo %}SUAP V2{% endblock %} · SUAP V2 · IFPB</title>
  <link rel="preload" href="{% static 'fontes/open-sans-latin-wght-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/tema.js' %}"></script>
  <script src="{% static 'js/app.js' %}" defer></script>
</head>
<body>
  <a class="pular-para-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <div class="faixa-marca" aria-hidden="true"></div>
  {% block corpo %}{% endblock %}
  <footer class="rodape">
    <div class="rodape__interno">
      <p>SUAP V2 · IFPB. Ferramenta de apoio pedagógico: não substitui o registro oficial no SUAP nem as decisões do Conselho de Classe.</p>
    </div>
  </footer>
</body>
</html>
