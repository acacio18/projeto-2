{% extends "base_acesso.html" %}
{% load interface %}
{% block titulo %}Senha criada{% endblock %}
{% block conteudo %}
<h1>Senha criada</h1>
<div class="alerta alerta--sucesso" role="status">
  {% icone "circle-check" %}
  <p>Pronto. Agora é só entrar com o seu e-mail institucional e a nova senha.</p>
</div>
<div class="acoes">
  <a class="botao botao--largo" href="{% url 'contas:entrar' %}">{% icone "log-in" %}<span>Entrar</span></a>
</div>
{% endblock %}
